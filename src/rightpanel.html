  <script>
  /* 右栏状态（展开 / 宽度）在解析阶段还原，避免首屏「先收后开」的闪动。
     第 32 轮：没有拖拽记录时，默认宽度 = panel-main（= panel 内容宽 - 左栏）的一半 */
  (function () {
    var st = {};
    try { st = JSON.parse(localStorage.getItem('cecoder.rsDrawer') || '{}') || {}; } catch (e) {}
    var d = document.getElementById('rsDrawer');
    if (!d) return;
    var panel = d.parentElement;
    var base = panel ? panel.clientWidth : 0;
    var ws = document.getElementById('wsDrawer');
    if (ws && ws.classList.contains('is-open')) base -= ws.offsetWidth;
    /* 第 34 轮：只有用户拖过（manual）才用手改宽度，否则一律「panel-main 的一半」 */
    var def = Math.max(280, Math.min(960, Math.round(base / 2)));
    var w = st.manual && st.w ? Math.max(280, Math.min(960, st.w)) : def;
    d.style.setProperty('--rs-w', w + 'px');
    if (st.open) {
      d.classList.add('is-open', 'no-anim');
      d.setAttribute('aria-hidden', 'false');
      d.dataset.restored = '1';
    }
  })();
  </script>
